apply plugin: 'com.android.application'

android {
    namespace 'jeston.org.mobilegrammar'
    compileSdk 35
    // product flavors must belong to a flavor dimension
    flavorDimensions 'version'
    productFlavors {
        free {
            dimension 'version'
            applicationId "org.mobile.grammar"
            versionName "1.8"
        }
        pro {
            dimension 'version'
            applicationId "org.mobile.grammar"
            versionName "2.0"
        }
    }

    defaultConfig {
        applicationId "jeston.org.mobilegrammar"
        // AndroidX libraries require Android 5.0 (API 21) or newer
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 5
        versionName "2.0"
        // runner of instrumentation tests
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testHandleProfiling true
        testFunctionalTest true
        multiDexEnabled true
    }
    buildFeatures {
        // BuildConfig.FLAVOR is used to tell the free and pro versions apart
        buildConfig true
    }
    // ApplicationTest uses the legacy android.test classes
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'org.hamcrest:hamcrest-library:1.3'
    // junit for instrumentation test
    testImplementation 'junit:junit:4.13.2'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
